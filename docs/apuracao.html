<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Construindo Juntos: apuração paralela</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A0A47">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root{
  color-scheme: light dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --roxo: #7602BD;
  --roxo-fundo: #4C0166;
  --lime: #00FF05;

  --bg: #F3EAFB;
  --panel: #FFFFFF;
  --panel-2: #EBDDF7;
  --ink: #1E0733;
  --muted: #5E4478;
  --line: rgba(30,7,51,.16);
  --accent: #7602BD;
  --on-accent: #FFFFFF;
  --bar: #7602BD;
  --bar-neutral: #A98CC4;
  --header: #2A0A47;
  --flash: rgba(0,255,5,.55);
  --warn: #C26A00;
  --warn-bg: #FFEBCB;
  --bad: #B00035;
  --bad-bg: #FFE0E8;
  --ok: #0B7A18;
  --ok-bg: #DDF7DF;
  --ring: #7602BD;
  --nulo: #4C0166;

  --display: "Archivo", "Arial Black", system-ui, sans-serif;
  --texto: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #1A052D;
    --panel: #2A0B47;
    --panel-2: #3A1361;
    --ink: #F6EFFC;
    --muted: #BBA6D3;
    --line: rgba(255,255,255,.16);
    --accent: #00FF05;
    --on-accent: #1A052D;
    --bar: #00FF05;
    --bar-neutral: #9C7FBD;
    --header: #22083B;
    --flash: rgba(0,255,5,.4);
    --warn: #FFB020;
    --warn-bg: #4A2E00;
    --bad: #FF7A97;
    --bad-bg: #4B0F25;
    --ok: #5DF264;
    --ok-bg: #0F3A16;
    --ring: #00FF05;
    --nulo: #B26DF0;
  }
}
:root[data-theme="dark"]{
  --bg: #1A052D; --panel: #2A0B47; --panel-2: #3A1361; --ink: #F6EFFC; --muted: #BBA6D3;
  --line: rgba(255,255,255,.16); --accent: #00FF05; --on-accent: #1A052D; --bar: #00FF05;
  --bar-neutral: #9C7FBD; --header: #22083B; --flash: rgba(0,255,5,.4);
  --warn: #FFB020; --warn-bg: #4A2E00; --bad: #FF7A97; --bad-bg: #4B0F25;
  --ok: #5DF264; --ok-bg: #0F3A16; --ring: #00FF05; --nulo: #B26DF0;
}

/* ---------- Base ---------- */
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
*,*::before,*::after{ box-sizing: inherit; }
body{
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1rem/1.5 var(--texto);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
h1,h2,h3{ font-family: var(--display); font-stretch: 125%; font-weight: 800; line-height: 1.05; margin: 0; letter-spacing: 0; }
h1{ font-size: clamp(1.7rem, 5.5vw, 2.6rem); }
h2{ font-size: clamp(1.35rem, 4vw, 1.9rem); }
h3{ font-size: 1.1rem; font-stretch: 112%; }
p{ margin: 0; }
button,input,select{ font: inherit; color: inherit; }
button{ cursor: pointer; }
:focus-visible{ outline: 3px solid var(--ring); outline-offset: 2px; }
[hidden]{ display: none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.oculto-scan{ position:absolute; left:-9999px; top:0; width:300px; height:300px; }

/* ---------- Cabeçalho e navegação ---------- */
.topo{
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--header); color: #fff; border-bottom: 3px solid var(--lime);
}
.topo-in{ max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding: 10px 16px; }
.logo{ height: 40px; width: auto; display: block; }
.espaco{ flex: 1; }
.nav{ display: flex; gap: 6px; }
.nav button{
  display: inline-flex; align-items: center; gap: 8px; position: relative;
  background: transparent; border: 0; color: #E9D9F7; padding: 10px 16px; border-radius: 999px; font-weight: 600;
}
.nav button:hover{ background: rgba(255,255,255,.1); }
.nav button[aria-current="page"]{ background: var(--lime); color: #1A052D; }
.nav svg{ width: 20px; height: 20px; flex: none; }
.selo{
  position: absolute; top: 2px; right: 4px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: #FFB020; color: #2A0A47; font-size: .75rem; font-weight: 800; display: grid; place-items: center;
}
.usuario{
  background: transparent; border: 1.5px solid rgba(255,255,255,.35); color: #fff; border-radius: 999px;
  padding: 8px 14px; font-weight: 600; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.usuario:hover{ border-color: var(--lime); }
.u-sair{ color: var(--lime); }
.u-nome + .u-sair{ margin-left: 6px; }
@media (max-width: 520px){ .u-nome{ display: none; } .u-nome + .u-sair{ margin-left: 0; } }

@media (max-width: 759px){
  .nav{
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; gap: 0;
    background: var(--header); border-top: 3px solid var(--lime);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .nav button{ flex: 1; flex-direction: column; gap: 2px; border-radius: 14px; padding: 8px 4px; font-size: .8125rem; }
  .selo{ right: calc(50% - 26px); top: 0; }
  .logo{ height: 34px; }
}

main{ max-width: 1080px; margin: 0 auto; padding: 20px 16px 120px; }
.pilha{ display: grid; gap: 16px; }

/* ---------- Componentes gerais ---------- */
.aviso-oficial{
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--panel-2); border-left: 6px solid var(--accent); border-radius: 12px; padding: 12px 14px;
  font-size: .9375rem;
}
.aviso-oficial svg{ width: 22px; height: 22px; flex: none; margin-top: 1px; }
.painel{
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px;
}
.painel + .painel{ margin-top: 16px; }
.lead{ color: var(--muted); max-width: 62ch; }
.btn{
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px;
  padding: 0 22px; border-radius: 999px; border: 2px solid var(--accent);
  background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none;
}
.btn:hover{ filter: brightness(1.08); }
.btn[disabled]{ opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost{ background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover{ border-color: var(--accent); }
.btn.perigo{ background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.pequeno{ min-height: 40px; padding: 0 16px; font-size: .9375rem; }
.btn svg{ width: 20px; height: 20px; flex: none; }
.campo{ display: grid; gap: 6px; }
.campo label{ font-weight: 600; font-size: .9375rem; }
.campo input, .campo select{
  min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--panel); color: var(--ink); width: 100%;
}
.campo input:disabled, .campo select:disabled{ opacity: .6; }
.campo small{ color: var(--muted); }
.linha-botoes{ display: flex; flex-wrap: wrap; gap: 10px; }
.msg{ border-radius: 12px; padding: 10px 14px; font-size: .9375rem; }
.msg.erro{ background: var(--bad-bg); color: var(--bad); }
.msg.ok{ background: var(--ok-bg); color: var(--ok); }
.msg.aviso{ background: var(--warn-bg); color: var(--warn); }
.msg:empty{ display: none; }
.vazio{ text-align: left; display: grid; gap: 12px; justify-items: start; padding: 8px 0; }

/* ---------- Apuração ---------- */
.cabeca-pagina{ display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; justify-content: space-between; }
.ao-vivo{ display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9375rem; color: var(--muted); }
.ao-vivo i{ width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: pulso 2s infinite; }
@keyframes pulso{ 0%{ box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 70%,100%{ box-shadow: 0 0 0 10px transparent; } }
.abas{ display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scrollbar-width: thin; }
.aba{
  flex: none; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--panel); color: var(--ink); font-weight: 600;
}
.aba:hover{ border-color: var(--accent); }
.aba[aria-selected="true"]{ background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.cargo-titulo{ font-size: clamp(2rem, 8vw, 3.6rem); font-stretch: 125%; font-weight: 900; }
.cargo-nota{ color: var(--muted); margin-top: 6px; }
.cobertura{ margin: 18px 0 22px; display: grid; gap: 10px; }
.cobertura p strong{ font-family: var(--display); font-stretch: 125%; font-size: 1.15rem; }
.urnas{ display: grid; grid-template-columns: repeat(auto-fill, minmax(18px, 1fr)); gap: 4px; }
.urna{ aspect-ratio: 1; border-radius: 4px; border: 1.5px solid var(--line); }
.urna.ok{ background: var(--bar); border-color: var(--bar); }
.urna.div{ background: var(--warn); border-color: var(--warn); }
.legenda{ display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; margin: 0; padding: 0; font-size: .875rem; color: var(--muted); }
.legenda li{ display: inline-flex; align-items: center; gap: 8px; }
.legenda .urna{ width: 14px; aspect-ratio: 1; }
.barras{ display: grid; gap: 4px; }
.item-barra{ border-radius: 14px; }
.linha{
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 10px 12px; border-radius: 14px;
}
.linha:hover{ background: var(--panel-2); }
.linha-topo{ display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.nome{ font-weight: 650; }
.numero{ color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; font-weight: 500; }
.valor{ font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; border-radius: 6px; padding: 0 4px; }
.pct{ color: var(--muted); margin-left: 8px; font-weight: 500; font-variant-numeric: tabular-nums; }
.trilho{ display: block; height: 18px; background: var(--panel-2); border-radius: 6px; margin-top: 8px; overflow: hidden; }
.linha:hover .trilho{ background: color-mix(in srgb, var(--panel-2) 70%, var(--line)); }
.fill{ height: 100%; width: 0; background: var(--bar); border-radius: 6px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.linha.neutra .fill{ background: var(--bar-neutral); }
.linha.subiu .valor{ animation: pisca 2s ease-out; }
@keyframes pisca{ 0%,60%{ background: var(--flash); } 100%{ background: transparent; } }
.detalhe{ padding: 2px 12px 14px; color: var(--muted); font-size: .9375rem; max-width: 70ch; }
.detalhe strong{ color: var(--ink); }
.rodape-grafico{ margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; color: var(--muted); font-size: .875rem; }
.chave{ display: inline-flex; align-items: center; gap: 8px; }
.chave input{ width: 20px; height: 20px; accent-color: var(--accent); }
.demo{ display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--muted); font-size: .875rem; }

/* ---------- Novo boletim ---------- */
.passos{ display: flex; gap: 8px; list-style: none; padding: 0; margin: 18px 0 4px; flex-wrap: wrap; }
.passos li{ display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9375rem; color: var(--muted); }
.passos li b{ display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); font-size: .8125rem; }
.passos li.atual{ color: var(--ink); }
.passos li.atual b{ background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.passos li.feito b{ background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.grade-urna{ display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 16px 0; }
@media (max-width: 520px){ .grade-urna{ grid-template-columns: 1fr 1fr; } .grade-urna .campo:first-child{ grid-column: 1 / -1; } }
.leitura{ display: grid; gap: 12px; margin-top: 8px; }
.leitor-caixa{ border: 2px dashed var(--accent); border-radius: 16px; padding: 10px; display: grid; gap: 10px; }
#leitor{ width: 100%; min-height: 60px; border-radius: 10px; overflow: hidden; }
.lista-cargos{ list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cargo-item{
  display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center;
  border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px;
}
.cargo-item.lido{ border-color: var(--ok); background: color-mix(in srgb, var(--ok-bg) 55%, transparent); }
.cargo-item strong{ display: block; }
.cargo-item span.sub{ color: var(--muted); font-size: .875rem; }
.marca{ width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.lido .marca{ border-color: var(--ok); background: var(--ok); color: #fff; }
.marca svg{ width: 14px; height: 14px; }
.barra-envio{ margin-top: 18px; display: grid; gap: 10px; }
.foto-prova{ display: flex; align-items: center; gap: 12px; font-size: .9375rem; color: var(--muted); }
.foto-prova img{ width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1.5px solid var(--line); }
details.teste{ margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 12px; color: var(--muted); font-size: .9375rem; }
details.teste summary{ cursor: pointer; font-weight: 600; }
details.teste .linha-botoes{ margin-top: 10px; }

/* ---------- Diálogos ---------- */
dialog{
  border: 0; border-radius: 22px; padding: 0; width: min(560px, calc(100vw - 24px)); max-width: 100%;
  background: var(--panel); color: var(--ink); box-shadow: 0 30px 90px rgba(0,0,0,.5);
}
dialog::backdrop{ background: rgba(20,3,36,.75); }
dialog.claro{
  --panel:#F3EAFB; --panel-2:#E4D3F3; --ink:#1E0733; --muted:#5E4478; --line:rgba(30,7,51,.2);
  --accent:#7602BD; --on-accent:#fff; --ring:#7602BD; --bad:#B00035; --bad-bg:#FFE0E8;
}
.dlg-corpo{ padding: 22px; display: grid; gap: 14px; max-height: min(88vh, 760px); overflow: auto; }
.logo-dlg{ height: 54px; width: auto; justify-self: start; }
hr{ border: 0; border-top: 1px solid var(--line); width: 100%; margin: 4px 0; }
.entradas{ display: grid; gap: 10px; }
.entradas .campo{ grid-template-columns: 1fr 120px; align-items: center; column-gap: 12px; }
.entradas .campo label{ font-weight: 500; }
.entradas .campo label span{ color: var(--muted); margin-left: 6px; }
.soma-info{ font-weight: 600; }
details.cargo-conf{ border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; }
details.cargo-conf summary{ cursor: pointer; font-weight: 650; display: flex; justify-content: space-between; gap: 10px; }
details.cargo-conf summary span{ color: var(--muted); font-weight: 500; }
table{ border-collapse: collapse; width: 100%; font-size: .9375rem; }
th,td{ text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th{ font-weight: 700; color: var(--muted); font-size: .875rem; }
td.n, th.n{ text-align: right; font-variant-numeric: tabular-nums; }
.rolagem{ overflow-x: auto; }

/* ---------- Administração ---------- */
.abas-admin{ display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 14px -2px 6px; }
.abas-admin .aba{ position: relative; }
.faixa-numeros{ display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 20px; background: var(--panel); overflow: hidden; }
.faixa-numeros > div{ padding: 18px; border-left: 1px solid var(--line); }
.faixa-numeros > div:first-child{ border-left: 0; }
.faixa-numeros dt{ color: var(--muted); font-size: .875rem; }
.faixa-numeros dd{ margin: 4px 0 0; font-family: var(--display); font-stretch: 125%; font-weight: 800; font-size: clamp(1.4rem, 4vw, 2.1rem); font-variant-numeric: tabular-nums; }
.faixa-numeros dd small{ display: block; font-family: var(--texto); font-stretch: 100%; font-weight: 500; font-size: .875rem; color: var(--muted); }
@media (max-width: 700px){
  .faixa-numeros{ grid-template-columns: 1fr 1fr; }
  .faixa-numeros > div:nth-child(3){ border-left: 0; }
  .faixa-numeros > div:nth-child(n+3){ border-top: 1px solid var(--line); }
}
.duas-colunas{ display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
@media (max-width: 800px){ .duas-colunas{ grid-template-columns: 1fr; } }
.colunas-tempo{ display: flex; align-items: flex-end; gap: 6px; height: 170px; margin-top: 14px; }
.col-tempo{ flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; min-width: 0; font-size: .75rem; color: var(--muted); }
.col-tempo .haste{ display: block; width: 100%; background: var(--bar); border-radius: 6px 6px 2px 2px; min-height: 4px; }
.col-tempo b{ color: var(--ink); font-variant-numeric: tabular-nums; }
.bn-linha{ display: grid; gap: 6px; margin-top: 12px; }
.bn-barra{ display: flex; height: 14px; border-radius: 6px; overflow: hidden; background: var(--panel-2); }
.bn-barra i:nth-child(1){ background: var(--bar-neutral); }
.bn-barra i:nth-child(2){ background: var(--nulo); }
.bn-texto{ font-size: .875rem; color: var(--muted); }
.fichas{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.ficha{ padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line); font-size: .875rem; font-variant-numeric: tabular-nums; }
.div-item{ border: 1.5px solid var(--warn); border-radius: 18px; padding: 18px; display: grid; gap: 12px; background: var(--panel); }
.div-item + .div-item{ margin-top: 14px; }
.div-item header p{ color: var(--muted); font-size: .9375rem; margin-top: 4px; }
td.atual{ background: color-mix(in srgb, var(--ok-bg) 60%, transparent); }
td.novo{ background: color-mix(in srgb, var(--warn-bg) 60%, transparent); }
.etiqueta{ display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8125rem; font-weight: 650; background: var(--panel-2); }
.etiqueta.alerta{ background: var(--warn-bg); color: var(--warn); }
.etiqueta.certo{ background: var(--ok-bg); color: var(--ok); }
.busca{ max-width: 260px; }

/* ---------- Toast ---------- */
#toast{
  position: fixed; left: 50%; transform: translate(-50%, 20px); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  z-index: 60; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600;
  max-width: min(92vw, 520px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
}
#toast.on{ opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 760px){ #toast{ bottom: 32px; } }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 4200);
}
function anunciar(msg) { $('#vivo').textContent = ''; setTimeout(() => { $('#vivo').textContent = msg; }, 50); }

/* =====================================================================
   3. ESTADO E PERSISTÊNCIA
   Toda a leitura e gravação passa por aqui. No app real, esta camada
   troca localStorage por Firestore (onSnapshot para o tempo real).
   ===================================================================== */
const CHAVE = 'cj-apuracao-v1';
let canal = null;
try { canal = new BroadcastChannel('cj-apuracao'); } catch (e) {}
const idAba = uid();
let state;

function padrao() {
  return { cfg: { zonas: [{zona:1, secoes:60}], turno: 1 }, boletins: {}, divergencias: [], demo: false, ultimo: null };
}
function carregar() {
  try { const r = localStorage.getItem(CHAVE); if (r) return JSON.parse(r); } catch (e) {}
  return null;
}
function salvar() {
  let ok = false;
  try { localStorage.setItem(CHAVE, JSON.stringify(state)); ok = true; } catch (e) {}
  if (!ok) { // cota cheia: guarda sem as fotos
    try {
      const s = clone(state); Object.values(s.boletins).forEach(b => delete b.foto);
      s.divergencias.forEach(d => delete d.novo.foto);
      localStorage.setItem(CHAVE, JSON.stringify(s));
    } catch (e) {}
  }
  try { canal && canal.postMessage({ de: idAba }); } catch (e) {}
}

const totalSecoes = () => state.cfg.zonas.reduce((a, z) => a + z.secoes, 0);
const chaveUrna = (z, s, t) => `${z}-${s}-${t}`;
const boletinsAtivos = () => Object.values(state.boletins).filter(b => b.turno === state.cfg.turno).sort((a, b) => a.zona - b.zona || a.secao - b.secao);
const pendentes = () => state.divergencias.filter(d => d.status === 'pendente');

/* ---------- Geração de dados de demonstração ---------- */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gerarCargo(cg, r) {
  const base = Math.round((230 + r() * 80) * cg.mult);
  const pesos = cg.pesos.map(p => p * (0.75 + r() * 0.5));
  const branco = Math.round(base * (0.02 + r() * 0.02));
  const nulo = Math.round(base * (0.03 + r() * 0.03));
  const validos = base - branco - nulo, soma = pesos.reduce((a, b) => a + b, 0);
  const votos = {}; let acc = 0;
  cg.cands.forEach((c, i) => {
    const v = i === cg.cands.length - 1 ? Math.max(0, validos - acc) : Math.round(validos * pesos[i] / soma);
    votos[c.n] = v; acc += v;
  });
  return { votos, branco, nulo, total: acc + branco + nulo, o: 'qrcode' };
}
function gerarBoletim(zona, secao, turno, r) {
  const cargos = {}; CARGOS.forEach(cg => { cargos[cg.id] = gerarCargo(cg, r); });
  return { zona, secao, turno, cargos };
}
const FISCAIS = ['Ana Luíza', 'Carlos Eduardo', 'Mirella Santos', 'Josenildo', 'Patrícia Lima'];
function semear() {
  const s = padrao(); s.demo = true;
  const r = rng(2026), agora = Date.now();
  const todas = []; s.cfg.zonas.forEach(z => { for (let i = 1; i <= z.secoes; i++) todas.push([z.zona, i]); });
  for (let i = todas.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [todas[i], todas[j]] = [todas[j], todas[i]]; }
  const sorteadas = todas.slice(0, 19);
  sorteadas.forEach(([z, sec], i) => {
    const b = gerarBoletim(z, sec, 1, r);
    b.id = chaveUrna(z, sec, 1); b.fiscal = FISCAIS[Math.floor(r() * FISCAIS.length)];
    b.enviadoEm = agora - (19 - i) * 9 * 60000 - 4 * 60000;
    s.boletins[b.id] = b; s.ultimo = b.id;
  });
  // uma urna com divergência esperando o administrador
  const alvo = s.boletins[chaveUrna(sorteadas[6][0], sorteadas[6][1], 1)];
  const novo = clone(alvo); const c = CARGO.presidente.cands;
  novo.cargos.presidente.votos[c[0].n] -= 14; novo.cargos.presidente.votos[c[1].n] += 14;
  novo.cargos.governador.branco += 3; novo.cargos.governador.votos[CARGO.governador.cands[2].n] -= 3;
  novo.fiscal = 'Josenildo'; novo.enviadoEm = agora - 18 * 60000; delete novo.id;
  s.divergencias.push({ id: uid(), key: alvo.id, novo, status: 'pendente', criadoEm: agora - 18 * 60000 });
  return s;
}

/* =====================================================================
   4. REGRAS DE NEGÓCIO
   ===================================================================== */
const somaCargo = d => Object.values(d.votos).reduce((a, b) => a + b, 0) + d.branco + d.nulo;
function normalizar(cargoId, r) {
  const votos = {}; CARGO[cargoId].cands.forEach(c => { votos[c.n] = Number(r.votos?.[c.n] ?? 0); });
  return { votos, branco: Number(r.branco ?? 0), nulo: Number(r.nulo ?? 0), total: Number(r.total) };
}
function validarCargo(id, d) {
  const cg = CARGO[id], erros = [];
  const nums = [...Object.values(d.votos || {}), d.branco, d.nulo, d.total];
  if (nums.some(v => !Number.isInteger(v) || v < 0)) erros.push('Há valores vazios, negativos ou fracionados.');
  if (!erros.length && somaCargo(d) !== d.total) erros.push(`A soma dos votos (${fmt(somaCargo(d))}) não bate com o total do boletim (${fmt(d.total)}).`);
  return erros;
}
function zonaInfo(z) { return state.cfg.zonas.find(x => x.zona === Number(z)); }
function validarUrna({ zona, secao, turno }) {
  const e = [], zi = zonaInfo(zona), s = Number(secao);
  if (!zi) e.push(`A zona ${zona || '?'} não faz parte desta cidade.`);
  else if (!Number.isInteger(s) || s < 1 || s > zi.secoes) e.push(`Na zona ${zona}, a seção deve estar entre 1 e ${zi.secoes}.`);
  if (![1, 2].includes(Number(turno))) e.push('O turno deve ser 1 ou 2.');
  return e;
}
function comparar(a, b) {
  const out = [];
  CARGOS.forEach(cg => {
    const x = a.cargos[cg.id], y = b.cargos[cg.id];
    if (!x || !y) { if (!!x !== !!y) out.push({ cargo: cg.nome, campo: 'Cargo', a: x ? 'lido' : 'ausente', b: y ? 'lido' : 'ausente' }); return; }
    cg.cands.forEach(c => { const va = x.votos[c.n] || 0, vb = y.votos[c.n] || 0; if (va !== vb) out.push({ cargo: cg.nome, campo: `${c.nome} (${c.n})`, a: va, b: vb }); });
    [['branco', 'Brancos'], ['nulo', 'Nulos'], ['total', 'Total apurado']].forEach(([k, l]) => { if ((x[k] || 0) !== (y[k] || 0)) out.push({ cargo: cg.nome, campo: l, a: x[k] || 0, b: y[k] || 0 }); });
  });
  return out;
}
function origemDe(b) {
  const os = new Set(Object.values(b.cargos).map(c => c.o));
  if (os.size === 1 && os.has('qrcode')) return 'QR Code';
  if (os.size === 1) return b.foto ? 'Digitado a partir da foto' : 'Digitado';
  return 'QR Code e digitação';
}

/* Regra central: uma urna só entra uma vez. */
function enviarBoletim(novo, fiscal) {
  const key = chaveUrna(novo.zona, novo.secao, novo.turno), atual = state.boletins[key], agora = Date.now();
  if (!atual) {
    state.boletins[key] = { ...clone(novo), id: key, fiscal, enviadoEm: agora };
    state.ultimo = key; salvar();
    return { status: 'novo', key };
  }
  const diffs = comparar(atual, novo);
  if (!diffs.length) return { status: 'igual', key, atual };
  const repetida = state.divergencias.find(d => d.key === key && d.status === 'pendente' && !comparar(d.novo, novo).length);
  if (repetida) return { status: 'divergente', key, diffs, jaAvisado: true };
  const d = { id: uid(), key, novo: { ...clone(novo), fiscal, enviadoEm: agora }, status: 'pendente', criadoEm: agora };
  state.divergencias.push(d); salvar();
  return { status: 'divergente', key, diffs };
}
function resolverDivergencia(id, decisao, admin) {
  const d = state.divergencias.find(x => x.id === id); if (!d) return;
  d.status = 'resolvida'; d.resolvidaPor = admin; d.resolvidaEm = Date.now();
  if (decisao === 'novo') {
    const antigo = state.boletins[d.key];
    state.boletins[d.key] = { ...clone(d.novo), id: d.key, corrigidoPor: admin, corrigidoEm: Date.now(), fiscalAnterior: antigo?.fiscal };
    state.ultimo = d.key; d.decisao = 'Usou o novo envio';
  } else d.decisao = 'Manteve o cadastro atual';
  state.divergencias.forEach(o => { // outras pendências da mesma urna que agora conferem
    if (o.status === 'pendente' && o.key === d.key && !comparar(state.boletins[o.key], o.novo).length) {
      o.status = 'resolvida'; o.decisao = 'Confere com o cadastro validado'; o.resolvidaPor = admin; o.resolvidaEm = Date.now();
    }
  });
  salvar();
}

/* ---------- Totais para o gráfico ---------- */
function totais(cargoId) {
  const cg = CARGO[cargoId], bs = boletinsAtivos();
  const linhas = cg.cands.map(c => ({ ...c, votos: 0, lidera: 0, melhorV: -1, melhorSecao: null, melhorZona: null }));
  let branco = 0, nulo = 0, total = 0, secoes = 0;
  bs.forEach(b => {
    const d = b.cargos[cargoId]; if (!d) return; secoes++;
    let topo = null;
    linhas.forEach(l => {
      const v = d.votos[l.n] || 0; l.votos += v;
      if (v > l.melhorV) { l.melhorV = v; l.melhorSecao = b.secao; l.melhorZona = b.zona; }
      if (!topo || v > (d.votos[topo.n] || 0)) topo = l;
    });
    if (topo) topo.lidera++;
    branco += d.branco; nulo += d.nulo; total += d.total;
  });
  return { linhas, branco, nulo, total, validos: total - branco - nulo, secoes };
}

/* =====================================================================
   5. DECODIFICAÇÃO DO QR CODE
   Esta função é o ponto de troca. O formato abaixo é o de demonstração
   (um QR Code por cargo, em JSON). Para o boletim real, substitua o
   corpo pela decodificação da especificação do TSE, mantendo o retorno.
   ===================================================================== */
function decodificarQR(texto) {
  let o; try { o = JSON.parse(texto); } catch (e) { return { erro: 'Este QR Code não tem o formato esperado pelo app.' }; }
  if (!o || o.cj !== 1 || !CARGO[o.c]) return { erro: 'Este QR Code não é de um boletim reconhecido pelo app.' };
  return { zona: Number(o.z), secao: Number(o.s), turno: Number(o.t), cargo: o.c, votos: o.v, branco: o.b, nulo: o.n, total: o.tt };
}
function qrDemo(b, cargoId) { // usado só no modo de teste
  const d = b.cargos[cargoId];
  return JSON.stringify({ cj: 1, z: b.zona, s: b.secao, t: b.turno, c: cargoId, v: d.votos, b: d.branco, n: d.nulo, tt: d.total });
}

function avisoLeitura(txt, tipo) { const m = $('#msg-leitura'); if (!m) return; m.className = 'msg ' + tipo; m.textContent = txt; }

/* ---------- Leitura por câmera ---------- */
async function abrirScanner() {
  if (!window.Html5Qrcode) return avisoLeitura('O leitor de QR Code não carregou. Use a foto do boletim ou digite os valores.', 'erro');
  $('#area-scan').hidden = false;
  scanner = new Html5Qrcode('leitor');
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, aoLerQR, () => {});
    avisoLeitura('Câmera aberta. Aponte para o QR Code de um cargo.', 'aviso');
  } catch (e) {
    scanner = null; $('#area-scan').hidden = true;
    avisoLeitura('Não consegui abrir a câmera. Libere a permissão no navegador ou use a foto do boletim.', 'erro');
  }
}
async function pararScanner() {
  const s = scanner; scanner = null;
  if (s) { try { await s.stop(); s.clear(); } catch (e) {} }
  const a = $('#area-scan'); if (a) a.hidden = true;
}
function aoLerQR(texto) {
  const agora = Date.now();
  if (texto === ultimoTexto && agora - ultimoTempo < 2500) return;
  ultimoTexto = texto; ultimoTempo = agora; processarQR(texto);
}
function processarQR(texto) {
  const r = decodificarQR(texto);
  if (r.erro) return avisoLeitura(r.erro, 'erro');
  const eu = validarUrna(r); if (eu.length) return avisoLeitura(eu[0], 'erro');
  const cg = CARGO[r.cargo];
  const jaTem = Object.keys(draft.cargos).length > 0 || draft.secao !== '';
  if (jaTem && (Number(draft.zona) !== r.zona || Number(draft.secao) !== r.secao || Number(draft.turno) !== r.turno))
    return avisoLeitura(`Este QR Code é da zona ${r.zona}, seção ${r.secao}, e você está cadastrando a zona ${draft.zona}, seção ${draft.secao}. Termine ou recomece este boletim primeiro.`, 'erro');
  const dados = normalizar(r.cargo, r), er = validarCargo(r.cargo, dados);
  if (er.length) return avisoLeitura(`${cg.nome}: ${er[0]} Leia o QR Code de novo.`, 'erro');
  dados.o = 'qrcode';
  const ant = draft.cargos[r.cargo];
  if (ant && !comparar({ cargos: { [r.cargo]: ant } }, { cargos: { [r.cargo]: dados } }).length) return;
  draft.zona = String(r.zona); draft.secao = String(r.secao); draft.turno = String(r.turno);
  draft.cargos[r.cargo] = dados;
  const feitos = Object.keys(draft.cargos).length;
  avisoLeitura(`${cg.nome} lido: ${fmt(dados.total)} votos apurados na seção ${r.secao}.${feitos === 5 ? ' Os cinco cargos foram lidos. Confira e envie.' : ''}`, 'ok');
  atualizarNovo();
  if (feitos === 5) pararScanner();
}

/* ---------- Foto do boletim ---------- */
function reduzirImagem(file, max = 900, q = .6) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}
async function aoEscolherFoto(file) {
  if (!file) return;
  draft.foto = await reduzirImagem(file);
  atualizarNovo();
  if (window.Html5Qrcode) {
    try {
      const h = new Html5Qrcode('leitor-oculto'), txt = await h.scanFile(file, false);
      try { h.clear(); } catch (e) {}
      processarQR(txt); return;
    } catch (e) {}
  }
  avisoLeitura('A foto ficou anexada como prova. Não achei um QR Code legível nela, então digite os valores de cada cargo olhando o boletim.', 'aviso');
}

  abrirDlg(`<div class="dlg-corpo">
    <h2 id="dlg-titulo">${esc(cg.nome)}</h2>

    <div class="entradas">${campos}
      <div class="campo"><label for="v-branco">Brancos</label><input id="v-branco" data-v="branco" type="number" inputmode="numeric" min="0" value="${d ? d.branco : ''}"></div>
      <div class="campo"><label for="v-nulo">Nulos</label><input id="v-nulo" data-v="nulo" type="number" inputmode="numeric" min="0" value="${d ? d.nulo : ''}"></div>
      <div class="campo"><label for="v-total"><strong>Total apurado no boletim</strong></label><input id="v-total" data-v="total" type="number" inputmode="numeric" min="0" value="${d ? d.total : ''}"></div>

  </div>`);
  conferirSoma();
}
function lerCampos() {
  const val = el => el.value === '' ? 0 : Number(el.value);
  const votos = {}; let soma = 0;
  $$('#dlg [data-v]').forEach(el => { const k = el.dataset.v; if (!['branco', 'nulo', 'total'].includes(k)) { votos[k] = val(el); soma += votos[k]; } });
  const branco = val($('#v-branco')), nulo = val($('#v-nulo'));
  const totalVazio = $('#v-total').value === '';
  return { votos, branco, nulo, total: totalVazio ? NaN : val($('#v-total')), soma: soma + branco + nulo };
}
function conferirSoma() {
  const info = $('#soma-info'), btn = $('#btn-salvar-cargo'); if (!info) return;
  const d = lerCampos();
  if (Number.isNaN(d.total)) { info.className = 'msg aviso'; info.textContent = `Soma até agora: ${fmt(d.soma)}. Informe o total impresso no boletim.`; btn.disabled = true; return; }
  const ok = d.soma === d.total && [...Object.values(d.votos), d.branco, d.nulo, d.total].every(v => Number.isInteger(v) && v >= 0);
  info.className = 'msg ' + (ok ? 'ok' : 'erro');
  info.textContent = ok ? `Soma ${fmt(d.soma)}, igual ao total. Pode salvar.` : `Soma ${fmt(d.soma)}, total informado ${fmt(d.total)}. Os números precisam bater.`;
  btn.disabled = !ok;
}

function montarBoletim() { return { zona: Number(draft.zona), secao: Number(draft.secao), turno: Number(draft.turno), cargos: clone(draft.cargos), foto: draft.foto || null }; }
function enviar() {

/* ---------- Simulação (modo de teste) ---------- */
function simular(modo) {
  const r = rng(Date.now() & 0xffffff), turno = state.cfg.turno;
  const existentes = boletinsAtivos(), livres = [];
  state.cfg.zonas.forEach(z => { for (let s = 1; s <= z.secoes; s++) if (!state.boletins[chaveUrna(z.zona, s, turno)]) livres.push([z.zona, s]); });
  let b;
  if (modo === 'nova') {
    if (!livres.length) return toast('Todas as urnas já foram apuradas.');
    const [z, s] = livres[Math.floor(r() * livres.length)]; b = gerarBoletim(z, s, turno, r);
  } else {
    if (!existentes.length) return toast('Ainda não há urna cadastrada para repetir.');
    const base = existentes[Math.floor(r() * existentes.length)]; b = clone(base);
    if (modo === 'diverge') {
      const c = CARGO.senador.cands; b.cargos.senador.votos[c[0].n] += 9; b.cargos.senador.votos[c[1].n] -= 9;
      b.cargos.estadual.nulo += 2; b.cargos.estadual.votos[CARGO.estadual.cands[0].n] -= 2;
    }
  }
  draft = novoDraft(); draft.zona = String(b.zona); draft.secao = String(b.secao); draft.turno = String(b.turno);
  CARGOS.forEach(cg => { draft.cargos[cg.id] = { ...normalizar(cg.id, decodificarQR(qrDemo(b, cg.id))), o: 'qrcode' }; });
  avisoLeitura('Os cinco QR Codes de teste foram lidos. Confira e envie.', 'ok');
  atualizarNovo();
}

function envios30() {
  const bs = Object.values(state.boletins); if (!bs.length) return [];
  const passo = 30 * 60000, fim = Math.floor(Math.max(...bs.map(b => b.enviadoEm)) / passo) * passo;
  const ini = Math.max(Math.floor(Math.min(...bs.map(b => b.enviadoEm)) / passo) * passo, fim - 9 * passo), cols = [];
  for (let t = ini; t <= fim; t += passo) cols.push({ t, n: bs.filter(b => b.enviadoEm >= t && b.enviadoEm < t + passo).length });
  return cols;
}

let filtroBol = '';
function adminBol() {
  const bs = boletinsAtivos().filter(b => !filtroBol || String(b.secao).includes(filtroBol));
  const divKeys = new Set(pendentes().map(d => d.key));
  return `<section class="painel"><div class="campo busca"><label for="f-bol">Buscar por seção</label><input id="f-bol" type="search" inputmode="numeric" value="${esc(filtroBol)}" data-act-input="filtro-bol"></div>
    <div class="rolagem"><table style="margin-top:12px"><thead><tr><th>Zona</th><th>Seção</th><th>Origem</th><th>Enviado por</th><th class="n">Hora</th><th>Situação</th><th></th></tr></thead><tbody>
    ${bs.length ? bs.map(b => `<tr><td>${b.zona}</td><td>${b.secao}</td><td>${esc(origemDe(b))}</td><td>${esc(b.fiscal)}</td><td class="n">${hora(b.enviadoEm)}</td>
      <td>${divKeys.has(b.id) ? '<span class="etiqueta alerta">Divergência</span>' : b.corrigidoPor ? '<span class="etiqueta">Validado pelo administrador</span>' : '<span class="etiqueta certo">Confere</span>'}</td>
      <td><button class="btn ghost pequeno" data-act="ver-bol" data-k="${b.id}">Ver</button></td></tr>`).join('') : '<tr><td colspan="7">Nenhum boletim encontrado.</td></tr>'}
    </tbody></table></div></section>`;
}
function adminExport() {
  const n = boletinsAtivos().length;
  return `<section class="painel"><h3>Planilhas com os dados atuais</h3>
    <p class="lead" style="margin:8px 0 16px">Os arquivos refletem o que está cadastrado agora, com ${n} ${n === 1 ? 'urna' : 'urnas'} do ${state.cfg.turno}º turno. O Excel traz quatro abas: resumo por candidato, votos por seção, lista de boletins e divergências. O CSV traz os votos por seção e abre direto no Excel em português (separador ponto e vírgula).</p>
    <div class="linha-botoes"><button class="btn" data-act="baixar-xlsx" ${n ? '' : 'disabled'}>${ICON.baixar}Baixar Excel (.xlsx)</button><button class="btn ghost" data-act="baixar-csv" ${n ? '' : 'disabled'}>${ICON.baixar}Baixar CSV</button></div></section>`;
}
function adminAjustes() {
  const zonasTxt = state.cfg.zonas.map(z => `${z.zona}:${z.secoes}`).join(', ');
  return `<section class="painel pilha"><h3>Configuração da cidade</h3>
    <div class="campo"><label for="aj-zonas">Zonas e quantidade de seções</label><input id="aj-zonas" value="${esc(zonasTxt)}"><small>Formato zona:seções, separados por vírgula. Exemplo: 1:60, 2:45.</small></div>
    <div class="campo"><label for="aj-turno">Turno em apuração</label><select id="aj-turno"><option value="1" ${state.cfg.turno === 1 ? 'selected' : ''}>1º turno</option><option value="2" ${state.cfg.turno === 2 ? 'selected' : ''}>2º turno</option></select></div>
    <p class="msg" id="aj-msg"></p>
    <div class="linha-botoes"><button class="btn" data-act="salvar-ajustes">Salvar ajustes</button></div>
    <hr>
    <h3>Dados</h3>
    <p class="lead">Os dados de demonstração usam candidatos fictícios. Quando for usar de verdade, apague tudo e carregue a lista oficial de candidatos.</p>
    <div class="linha-botoes"><button class="btn ghost" data-act="carregar-demo">Carregar dados de demonstração</button><button class="btn perigo" data-act="apagar">Apagar todos os dados</button></div>
  </section>`;
}

/* ---------- Exportação ---------- */
function linhasLongas() {
  const rows = [];
  boletinsAtivos().forEach(b => CARGOS.forEach(cg => {
    const d = b.cargos[cg.id]; if (!d) return;
    const base = { 'Zona': b.zona, 'Seção': b.secao, 'Turno': b.turno, 'Cargo': cg.nome, 'Origem': origemDe(b), 'Enviado por': b.fiscal, 'Enviado em': new Date(b.enviadoEm).toLocaleString('pt-BR') };
    cg.cands.forEach(c => rows.push({ ...base, 'Número': c.n, 'Candidato': c.nome, 'Votos': d.votos[c.n] || 0 }));
    rows.push({ ...base, 'Número': '', 'Candidato': 'Brancos', 'Votos': d.branco });
    rows.push({ ...base, 'Número': '', 'Candidato': 'Nulos', 'Votos': d.nulo });
    rows.push({ ...base, 'Número': '', 'Candidato': 'Total apurado', 'Votos': d.total });
  }));
  return rows;
}
function linhasResumo() {
  const rows = [];
  CARGOS.forEach(cg => {
    const t = totais(cg.id);
    [...t.linhas].sort((a, b) => b.votos - a.votos).forEach(l => rows.push({ 'Cargo': cg.nome, 'Número': l.n, 'Candidato': l.nome, 'Votos': l.votos, '% dos válidos': Number((t.validos ? l.votos / t.validos * 100 : 0).toFixed(2)) }));
    rows.push({ 'Cargo': cg.nome, 'Número': '', 'Candidato': 'Brancos', 'Votos': t.branco, '% dos válidos': '' });
    rows.push({ 'Cargo': cg.nome, 'Número': '', 'Candidato': 'Nulos', 'Votos': t.nulo, '% dos válidos': '' });
    rows.push({ 'Cargo': cg.nome, 'Número': '', 'Candidato': 'Total apurado', 'Votos': t.total, '% dos válidos': '' });
  });
  return rows;
}
function linhasBoletins() {
  const dk = new Set(pendentes().map(d => d.key));
  return boletinsAtivos().map(b => ({ 'Zona': b.zona, 'Seção': b.secao, 'Turno': b.turno, 'Origem': origemDe(b), 'Enviado por': b.fiscal, 'Enviado em': new Date(b.enviadoEm).toLocaleString('pt-BR'), 'Situação': dk.has(b.id) ? 'Divergência pendente' : b.corrigidoPor ? 'Validado pelo administrador' : 'Confere' }));
}
function linhasDiv() {
  return state.divergencias.map(d => { const [z, s, t] = d.key.split('-'); return { 'Zona': z, 'Seção': s, 'Turno': t, 'Novo envio por': d.novo.fiscal, 'Diferenças': comparar(state.boletins[d.key] || { cargos: {} }, d.novo).length, 'Situação': d.status === 'pendente' ? 'Pendente' : 'Resolvida', 'Decisão': d.decisao || '', 'Por': d.resolvidaPor || '' }; });
}
function csvDe(rows) {
  const cols = Object.keys(rows[0] || {}), q = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return '\ufeff' + [cols.join(';'), ...rows.map(r => cols.map(c => q(r[c])).join(';'))].join('\r\n');
}
const carimbo = () => new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
async function salvarArquivo(nome, dados) {
  let d = null; try { d = await window.claude?.use?.('downloads'); } catch (e) {}
  if (d) {
    try { await d.save({ filename: nome, data: dados }); toast('Arquivo salvo.'); }
    catch (e) { if (e?.code !== 'declined') toast('Não foi possível salvar o arquivo.'); }
    return;
  }
  const blob = dados instanceof Blob ? dados : new Blob([dados]), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Download iniciado.');
}
function folha(rows) {
  const ws = XLSX.utils.json_to_sheet(rows), cols = Object.keys(rows[0] || {});
  ws['!cols'] = cols.map(c => ({ wch: Math.min(34, Math.max(c.length, ...rows.slice(0, 200).map(r => String(r[c] ?? '').length)) + 2) }));
  return ws;
}
async function baixarXlsx() {
  if (!window.XLSX) return toast('A biblioteca de planilhas não carregou. Tente o CSV.');
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, folha(linhasResumo()), 'Resumo');
  XLSX.utils.book_append_sheet(wb, folha(linhasLongas()), 'Por seção');
  XLSX.utils.book_append_sheet(wb, folha(linhasBoletins()), 'Boletins');
  const dv = linhasDiv(); XLSX.utils.book_append_sheet(wb, folha(dv.length ? dv : [{ 'Situação': 'Nenhuma divergência registrada' }]), 'Divergências');
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  await salvarArquivo(`apuracao-${carimbo()}.xlsx`, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}
async function baixarCsv() { await salvarArquivo(`apuracao-por-secao-${carimbo()}.csv`, new Blob([csvDe(linhasLongas())], { type: 'text/csv;charset=utf-8' })); }

/* =====================================================================
   10. DIÁLOGOS
   ===================================================================== */
const dlg = $('#dlg');
function abrirDlg(html, claro = false) { dlg.className = claro ? 'claro' : ''; dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); const f = dlg.querySelector('input,select,button'); if (f) f.focus({ preventScroll: true }); }
function fecharDlg() { if (dlg.open) dlg.close(); }
dlg.addEventListener('click', e => { if (e.target === dlg) fecharDlg(); });
function perguntar(titulo, texto, ok) {
  return new Promise(res => {
    abrirDlg(`<div class="dlg-corpo"><h2 id="dlg-titulo">${esc(titulo)}</h2><p>${esc(texto)}</p><div class="linha-botoes"><button class="btn perigo" data-act="sim-pergunta">${esc(ok)}</button><button class="btn ghost" data-act="fechar">Cancelar</button></div></div>`);
    perguntar.res = res; dlg.addEventListener('close', () => { if (perguntar.res) { perguntar.res(false); perguntar.res = null; } }, { once: true });
  });
}
function abrirLogin() {
  abrirDlg(`<div class="dlg-corpo"><img class="logo-dlg" src="${LOGO_ROXO}" alt="Construindo Juntos">
    <h2 id="dlg-titulo">Entrar</h2>
    <div class="campo"><label for="l-nome">Seu nome</label><input id="l-nome" autocomplete="name" placeholder="Nome e sobrenome"></div>
    <button class="btn" data-act="login-fiscal">Entrar como fiscal</button>
    <hr>
    <div class="campo"><label for="l-pin">Código de administrador</label><input id="l-pin" type="password" inputmode="numeric" autocomplete="off"></div>
    <button class="btn ghost" data-act="login-admin">Entrar como administrador</button>
    <p class="msg erro" id="l-erro" role="alert"></p></div>`, true);
}
function mostrarFotos(id) {
  const d = state.divergencias.find(x => x.id === id), atual = state.boletins[d.key];
  const bloco = (t, b) => b?.foto ? `<div><h3>${t}</h3><img src="${b.foto}" alt="${t}" style="width:100%;border-radius:12px;margin-top:8px;border:1.5px solid var(--line)"></div>` : `<div><h3>${t}</h3><p class="lead">Sem foto anexada.</p></div>`;
  abrirDlg(`<div class="dlg-corpo"><h2 id="dlg-titulo">Fotos da seção ${atual.secao}</h2>${bloco('Cadastro atual', atual)}${bloco('Novo envio', d.novo)}<button class="btn ghost" data-act="fechar">Fechar</button></div>`);
}
function verBoletim(k) {
  const b = state.boletins[k];
  const blocos = CARGOS.map(cg => { const d = b.cargos[cg.id]; return `<details class="cargo-conf"><summary>${esc(cg.nome)}<span>${fmt(d.total)} votos</span></summary><table><tbody>${cg.cands.map(c => `<tr><td>${esc(c.nome)} <span style="color:var(--muted)">${c.n}</span></td><td class="n">${fmt(d.votos[c.n])}</td></tr>`).join('')}<tr><td>Brancos</td><td class="n">${fmt(d.branco)}</td></tr><tr><td>Nulos</td><td class="n">${fmt(d.nulo)}</td></tr></tbody></table></details>`; }).join('');
  abrirDlg(`<div class="dlg-corpo"><h2 id="dlg-titulo">Zona ${b.zona}, seção ${b.secao}</h2><p>Enviado por ${esc(b.fiscal)} às ${hora(b.enviadoEm)}. Origem: ${esc(origemDe(b))}.${b.corrigidoPor ? ` Validado por ${esc(b.corrigidoPor)}.` : ''}</p>${blocos}${b.foto ? `<img src="${b.foto}" alt="Foto do boletim" style="width:100%;border-radius:12px;border:1.5px solid var(--line)">` : ''}<button class="btn ghost" data-act="fechar">Fechar</button></div>`);
}

/* =====================================================================
   11. EVENTOS
   ===================================================================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'ir': ir(el.dataset.v); break;
    case 'usuario': if (sessao) { definirSessao(null); if (vista !== 'apuracao') vista = 'apuracao'; render(); toast('Você saiu.'); } else abrirLogin(); break;
    case 'cargo': cargoSel = el.dataset.c; linhaAberta = null; render(); break;
    case 'linha': linhaAberta = linhaAberta === el.dataset.k ? null : el.dataset.k; render(); break;
    case 'simular-chegada': simularChegada(); break;
    case 'scan': abrirScanner(); break;
    case 'parar-scan': pararScanner(); break;
    case 'foto': $('#arq-foto').click(); break;
    case 'digitar-prox': abrirDigitar((CARGOS.find(c => !draft.cargos[c.id]) || CARGOS[0]).id); break;
    case 'digitar': abrirDigitar(el.dataset.c); break;
    case 'salvar-cargo': {
      const id = el.dataset.c, d = lerCampos(), dados = { votos: d.votos, branco: d.branco, nulo: d.nulo, total: d.total, o: 'digitado' };
      if (validarCargo(id, dados).length) return conferirSoma();
      if (draft.secao === '' ) { fecharDlg(); return avisoLeitura('Informe a zona e a seção antes de digitar os cargos.', 'erro'); }
      draft.cargos[id] = dados; fecharDlg(); avisoLeitura(`${CARGO[id].nome} salvo: ${fmt(dados.total)} votos apurados.`, 'ok'); atualizarNovo(); break;
    }
    case 'conferir': conferir(); break;
    case 'enviar': enviar(); break;
    case 'pos-envio': fecharDlg(); ir(el.dataset.v); break;
    case 'recomecar': pararScanner(); draft = novoDraft(); avisoLeitura('', ''); atualizarNovo(); break;
    case 'sim': simular(el.dataset.m); break;
    case 'fechar': fecharDlg(); break;
    case 'sim-pergunta': if (perguntar.res) { const r = perguntar.res; perguntar.res = null; fecharDlg(); r(true); } break;
    case 'login-fiscal': {
      const n = $('#l-nome').value.trim();
      if (n.length < 3) { $('#l-erro').textContent = 'Digite seu nome para entrar.'; return; }
      definirSessao({ nome: n, admin: false }); fecharDlg(); render(); toast(`Bem-vindo, ${n}.`); break;
    }
    case 'login-admin': {
      if ($('#l-pin').value !== ADMIN_PIN) { $('#l-erro').textContent = 'Código incorreto.'; return; }
      definirSessao({ nome: $('#l-nome').value.trim() || 'Administrador', admin: true }); fecharDlg(); render(); toast('Área de administração liberada.'); break;
    }
    case 'aba-admin': abaAdmin = el.dataset.a; render(); break;
    case 'resolver': resolverDivergencia(el.dataset.id, el.dataset.d, sessao.nome); toast(el.dataset.d === 'novo' ? 'Novo envio validado. A apuração foi atualizada.' : 'Cadastro atual mantido.'); render(); break;
    case 'ver-fotos': mostrarFotos(el.dataset.id); break;
    case 'ver-bol': verBoletim(el.dataset.k); break;
    case 'baixar-xlsx': baixarXlsx(); break;
    case 'baixar-csv': baixarCsv(); break;
    case 'salvar-ajustes': {
      const zonas = $('#aj-zonas').value.split(',').map(p => p.trim().split(':').map(Number)).filter(p => p.length === 2 && p.every(n => Number.isInteger(n) && n > 0)).map(([zona, secoes]) => ({ zona, secoes }));
      const m = $('#aj-msg');
      if (!zonas.length) { m.className = 'msg erro'; m.textContent = 'Use o formato zona:seções, por exemplo 1:60.'; return; }
      state.cfg.zonas = zonas; state.cfg.turno = Number($('#aj-turno').value); salvar(); draft = novoDraft(); render(); toast('Ajustes salvos.'); break;
    }
    case 'carregar-demo': if (await perguntar('Carregar demonstração?', 'Isso substitui todos os dados atuais por dados fictícios.', 'Carregar')) { state = semear(); salvar(); draft = novoDraft(); render(); toast('Dados de demonstração carregados.'); } break;
    case 'apagar': if (await perguntar('Apagar todos os dados?', 'Todos os boletins e divergências serão removidos deste aparelho. Isso não pode ser desfeito.', 'Apagar tudo')) { const cfg = state.cfg; state = padrao(); state.cfg = cfg; salvar(); draft = novoDraft(); render(); toast('Dados apagados.'); } break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'bn') { mostrarBN = t.checked; render(); }
  else if (t.id === 'arq-foto') { aoEscolherFoto(t.files[0]); t.value = ''; }
  else if (t.dataset.campo) { draft[t.dataset.campo] = t.value; atualizarNovo(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest('#dlg') && t.dataset.v !== undefined) conferirSoma();
  else if (t.dataset.actInput === 'filtro-bol') { filtroBol = t.value.trim(); const pos = t.selectionStart; render(); const n = $('#f-bol'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (t.dataset.campo === 'secao') { draft.secao = t.value; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && dlg.open && e.target.id === 'l-pin') { e.preventDefault(); $('[data-act="login-admin"]').click(); }
  if (e.key === 'Enter' && dlg.open && e.target.id === 'l-nome') { e.preventDefault(); $('[data-act="login-fiscal"]').click(); }
});

/* Tempo real entre abas: no app real, isto vira onSnapshot do Firestore. */
if (canal) canal.onmessage = ev => {
  if (ev.data?.de === idAba) return;
  const antes = pendentes().length, novo = carregar(); if (!novo) return;
  state = novo;
  if (sessao?.admin && pendentes().length > antes) toast('Nova divergência entre boletins da mesma urna. Veja em Administração.');
  if (vista === 'apuracao' || vista === 'admin') { const y = window.scrollY; if (!dlg.open) { render(); window.scrollTo({ top: y }); } }
  else atualizarCabecalho();
  anunciar('Apuração atualizada com um novo boletim.');
};

/* =====================================================================
   12. INÍCIO
   ===================================================================== */
state = carregar() || (() => { const s = semear(); return s; })();
try { localStorage.setItem(CHAVE, JSON.stringify(state)); } catch (e) {}
draft = novoDraft();
render();
</script>
